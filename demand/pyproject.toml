[project]
name = "smard-demand"
version = "0.1.0"
description = "Beat SMARD's published 15-minute regional electricity demand forecasts for Germany"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.60",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
nn = ["torch==2.10.0"]   # CUDA build from PyPI; the homelab image installs it

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demand"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
