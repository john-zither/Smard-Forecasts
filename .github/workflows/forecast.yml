name: Run Forecast

on:
  schedule:
    - cron: "15 * * * *"  # every hour at minute 15 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run forecast at Berlin time
        run: |
          python - <<'EOF'
          from datetime import datetime
          import pytz
          import subprocess

          berlin = pytz.timezone("Europe/Berlin")
          now_berlin = datetime.now(berlin)
          hour = now_berlin.hour

          if hour == 12:
              print(f"Running noon unified forecast at Berlin time {now_berlin.strftime('%H:%M')}")
              subprocess.run(["python", "main.py"], check=True)
          elif hour == 20:
              print(f"Running evening unified forecast at Berlin time {now_berlin.strftime('%H:%M')}")
              subprocess.run(["python", "main_evening.py"], check=True)
          else:
              print(f"Skipping: no model for Berlin hour {hour}")
          EOF

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add forecast_database.csv
          git commit -m "Update forecast database" || echo "No changes"
          git push
